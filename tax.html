<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Income Tax Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>
    <header class="site-header">
        <nav class="top-nav" aria-label="Main Navigation">
            <a href="main.html" class="back-link">&larr; Main Menu</a>
        </nav>
        <h1>Income Tax Calculator</h1>
    </header>

    <main class="container">
        <section class="card">
            <h2>Compute Net Taxable Income</h2>
            <div class="input-group">
                <label for="taxable-income">Taxable Income (PHP)</label>
                <input type="number" id="taxable-income" min="0" step="any" placeholder="e.g. 520000">
            </div>
            <button type="button" class="btn" id="compute-tax-btn">Compute Tax</button>
            <div class="input-group">
                <label for="tax-result">Income Tax (PHP)</label>
                <input type="text" id="tax-result" class="output-box" readonly>
            </div>
        </section>
    </main>
</body>
</html>
